<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess the Word Game</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1, h2, h3 {
            color: #333;
        }

        form {
            margin-top: 20px;
        }

        input[type="text"] {
            padding: 5px;
            font-size: 16px;
            width: 30px;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #014a36;
            box-shadow: 0 0 0 3px rgba(1, 74, 54, 0.15);
        }

        input[type="submit"] {
            padding: 5px 10px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #014a36;
            border-radius: 4px;
            background: #fff;
            color: #014a36;
            transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease;
        }

        input[type="submit"]:hover {
            background: #014a36;
            color: #fff;
        }

        input[type="submit"]:active {
            transform: scale(0.96);
        }

        .form-1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .game-over-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.25s ease-out;
        }

        .game-over-dialog {
            background: white;
            color: #222;

            padding: 35px;
            border-radius: 15px;

            width: 90%;
            max-width: 400px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: popIn 0.25s ease-out;
        }

        .game-over-dialog h2 {
            margin-top: 0;
        }

        .game-over-dialog strong {
            font-size: 24px;
            color: #d9534f;
        }

        .game-over-buttons {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .game-over-buttons a {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            background: #014a36;
            color: white;

            font-weight: bold;
            transition: opacity 0.2s ease, transform 0.1s ease;
            display: inline-block;
        }

        .game-over-buttons a:hover {
            opacity: 0.85;
        }

        .game-over-buttons a:active {
            transform: scale(0.96);
        }

        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.25s ease-out;
        }

        .dialog-box {
            background: white;
            color: #222;
            padding: 35px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: popIn 0.25s ease-out;
        }

        .dialog-buttons {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .dialog-buttons a {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            background: #014a36;
            color: white;
            font-weight: bold;
            transition: opacity 0.2s ease, transform 0.1s ease;
            display: inline-block;
        }

        .dialog-buttons a:hover {
            opacity: 0.85;
        }

        .dialog-buttons a:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>

    <h1 align="center">Welcome to the Guess the Word Game</h1>
    <h3 align="center"> CATEGORY:  <b th:text="${category}">Fruits</b></h3>
    <h2 align="center">
        Guess this hidden word:
        <span th:text="${updatedWord}">DEFAULT WORD</span>
    </h2>

    <p align="right">
        You have
        <b th:text="${remainingAttempts}">5</b>
        attempts remaining
    </p>

    <hr style="border: 11px solid #014a36c5;">

    <div align="center">

        <!-- GUESS FORM -->
        <form th:action="@{/game}" method="GET" class="form-1">

            <!-- Preserve selected category -->
            <input
                type="hidden"
                name="category"
                th:value="${category}"
            >

            <label for="guessedChar">Guess a character:</label>

            <input
                type="text"
                id="guessedChar"
                name="guessedChar"
                maxlength="1"
                required
            >

            <input type="submit" value="Try">

        </form>

 
        <form th:action="@{/game}" method="GET">
 
            <input
                type="hidden"
                name="category"
                th:value="${category}"
            >

            <input type="submit" value="Restart Game">

        </form>
         
        <div id="successDialog" class="dialog-overlay"
            th:if="${gameWon}">

            <div class="dialog-box">

                <h2>🎉 Congratulations!</h2>

                <p>You guessed the word correctly!</p>

                <h3 th:text="${chosenWord}">
                    WORD
                </h3>

                <div class="dialog-buttons">
 
                    <a th:href="@{/game(category=${category})}">
                        Restart Game
                    </a> 
                    <a th:href="@{/}">
                        Back to Categories
                    </a>

                </div>

            </div>
        </div> 
        <div class="game-over-overlay" th:if="${gameOver}">

            <div class="game-over-dialog">

                <h2>Game Over! 😢</h2>

                <p>You have <b>0 attempts remaining</b>.</p>

                <p>
                    The word was:
                    <strong th:text="${correctWord}">apple</strong>
                </p>

                <div class="game-over-buttons">
 
                    <a th:href="@{/game(category=${category})}">
                        🔄 Restart
                    </a>
 
                    <a th:href="@{/}">
                        🏠 Back
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
