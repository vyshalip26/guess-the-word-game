<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Word — The Garden Stall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style> 
  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(127,176,105,0.10), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(232,98,63,0.08), transparent 45%),
      #f1f2f2;
    color: #000000;
    font-family: 'Nunito', sans-serif;
  }

  h1, h2, h3{ font-family: 'Baloo 2', sans-serif; }
 
  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
 
  .signboard{
    text-align:center;
    margin-bottom: 40px; 
  } 

  .eyebrow{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;  
    font-size:12px;
    color: #98cc6e;
    background:#2c4d38; 
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px; 
  } 

  .signboard h1{
    font-size: 42px;
    margin: 0 0 12px;
    font-weight: 800; 
    color: #000000; 
  }
  .categories{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }

  .category{
    display: block;
    text-decoration: none;
    background: #23402f;
    border: 2px solid #2f5240;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    color: #f5ecd6;
  }

  .category:hover{
    background: #2c4d38;
  }

  .icon{
    font-size: 30px;
    display: block;
    margin-bottom: 8px;
  }

  .category h3{
    margin: 0;
    font-size: 18px;
  }
  .accent-word{ 
    color: #2c4d38; 
  } 

  .signboard p.sub{
    color:#f5ecd6;
    font-size: 15px;
    max-width: 500px;
    margin: 0 auto; 
  }

   
</style>
</head>
<body>

<div class="wrap">

  <div class="signboard">
    <span class="eyebrow">🌿 The Garden Stall</span>
    <h1>Guess the <span class="accent-word">Word</span></h1>
    <p class="sub">Pick a stall below and see what's waiting to be guessed inside.</p>
  </div>

  <div class="section-label">
    <h2>🧺 Browse Categories</h2> 
  </div>

  <div class="categories">
      <a href="/game?category=fruits" class="category">
        <span class="icon">🍊</span>
        <h3>Fruits</h3>
      </a>

      <a href="/game?category=vegetables" class="category">
        <span class="icon">🥕</span>
        <h3>Vegetables</h3>
      </a>

      <a href="/game?category=colors" class="category">
        <span class="icon">🎨</span>
        <h3>Colors</h3>
      </a>

      <a href="/game?category=food" class="category">
        <span class="icon">🍕</span>
          <h3>Colors</h3>
      </a>
      <a href="/game?category=animals" class="category">  
          <span class="icon">🦁</span>
          <h3>Animals</h3>  
      </a>
      <a href="/game?category=birds" class="category">  
          <span class="icon">🐦</span>
          <h3>Birds</h3>  
      </a>
  </div>
  </div>
</div>

</body>
</html>
